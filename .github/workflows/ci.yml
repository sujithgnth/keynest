name: KeyNest CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: keynest
          POSTGRES_USER: keynest
          POSTGRES_PASSWORD: keynest
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U keynest -d keynest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      rabbitmq:
        image: rabbitmq:4.3.4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: keynest
          RABBITMQ_DEFAULT_PASS: keynest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 8s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://keynest:keynest@localhost:5433/keynest
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://keynest:keynest@localhost:5672
      WEB_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run format:check
      - run: npm run lint -- --skip-nx-cache
      - run: npm run test:api
      - run: npm run build -- --skip-nx-cache
      - run: npm run db:migrate
      - name: Start API and worker
        env:
          NODE_ENV: production
        run: |
          node dist/apps/api/main.js > /tmp/keynest-api.log 2>&1 &
          node dist/apps/worker/main.js > /tmp/keynest-worker.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3333/api/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/keynest-api.log
          exit 1
      - run: npm run test:e2e
      - name: Print runtime logs on failure
        if: failure()
        run: |
          cat /tmp/keynest-api.log || true
          cat /tmp/keynest-worker.log || true
