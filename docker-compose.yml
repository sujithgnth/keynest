name: keynest
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: keynest
      POSTGRES_USER: keynest
      POSTGRES_PASSWORD: keynest
    ports: ['5433:5432']
    # PostgreSQL 18 stores major-version clusters beneath this parent path.
    volumes: ['postgres_data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keynest -d keynest']
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8.2-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: keynest
      RABBITMQ_DEFAULT_PASS: keynest
    ports: ['5672:5672', '15672:15672']
    volumes: ['rabbitmq_data:/var/lib/rabbitmq']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 8s
      timeout: 5s
      retries: 15

  migrate:
    build: .
    command: ['npm', 'run', 'db:migrate']
    environment:
      DATABASE_URL: postgresql://keynest:keynest@postgres:5432/keynest
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build:
      context: .
      args: { NEXT_PUBLIC_API_URL: http://localhost:3333/api }
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://keynest:keynest@postgres:5432/keynest
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://keynest:keynest@rabbitmq:5672
      WEB_ORIGINS: http://localhost:3000
      LOG_FILE: /var/log/keynest/api.log
      SERVICE_NAME: keynest-api
    ports: ['3333:3333']
    volumes: ['keynest_logs:/var/log/keynest']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3333/api/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    command: ['node', 'dist/apps/worker/main.js']
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://keynest:keynest@rabbitmq:5672
      LOG_FILE: /var/log/keynest/worker.log
    volumes: ['keynest_logs:/var/log/keynest']
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: .
      args: { NEXT_PUBLIC_API_URL: http://localhost:3333/api }
    command: ['npx', 'next', 'start', 'apps/web', '-p', '3000']
    ports: ['3000:3000']
    depends_on:
      api: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      [
        '--config.file=/etc/prometheus/prometheus.yml',
        '--storage.tsdb.retention.time=7d',
      ]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ['9090:9090']

  loki:
    image: grafana/loki:3.7.3
    command: ['-config.file=/etc/loki/local-config.yml']
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki_data:/loki
    ports: ['3100:3100']

  promtail:
    # Promtail was merged into Alloy after 3.6; this last available line keeps
    # the local log pipeline small while an Alloy migration remains explicit.
    image: grafana/promtail:3.6.3
    command: ['-config.file=/etc/promtail/config.yml']
    volumes:
      - ./infrastructure/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - keynest_logs:/var/log/keynest:ro
      - promtail_data:/run/promtail
    depends_on: [loki]

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: keynest
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3001:3000']
    depends_on: [prometheus, loki]

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  loki_data:
  grafana_data:
  promtail_data:
  keynest_logs:
