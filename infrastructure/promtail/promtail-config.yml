server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /run/promtail/positions.yml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: keynest
    static_configs:
      - targets: [localhost]
        labels:
          job: keynest
          __path__: /var/log/keynest/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
      - labels:
          level:
          service:
